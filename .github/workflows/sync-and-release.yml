name: Sync upstream + Release binaries

on:
  schedule:
    # каждый день в 03:00 UTC (это 06:00 по Москве)
    - cron: '0 3 * * *'
  workflow_dispatch:   # можно запускать вручную кнопкой

permissions:
  contents: write

env:
  GO_VERSION: "1.26.x"
  UPSTREAM: "openlibrecommunity/olcrtc"
  UPSTREAM_BRANCH: "master"

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git || true
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Sync with upstream
        id: sync
        run: |
          BEFORE=$(git rev-parse HEAD)

          git merge --no-edit upstream/${{ env.UPSTREAM_BRANCH }} || {
            echo "Merge conflict — aborting"
            git merge --abort
            exit 1
          }

          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new commits from upstream"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New commits detected, pushing..."
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up Go
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Mage
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: go install github.com/magefile/mage@latest

      - name: Build binaries
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: mage cross

      - name: Prepare release tag
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${DATE}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create / update Release
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: olcrtc ${{ steps.tag.outputs.tag }}
          body: |
            Automatic build from upstream `openlibrecommunity/olcrtc`

            ### Binaries
            - `olcrtc-linux-amd64`
            - `olcrtc-linux-arm64`
            - `olcrtc-windows-amd64.exe`
            - `olcrtc-darwin-amd64`
            - `olcrtc-darwin-arm64`
            and others from `mage cross`
          files: |
            build/olcrtc-linux-amd64
            build/olcrtc-linux-arm64
            build/olcrtc-windows-amd64.exe
            build/olcrtc-darwin-amd64
            build/olcrtc-darwin-arm64
            build/olcrtc-freebsd-amd64
            build/olcrtc-freebsd-arm64
            build/olcrtc-openbsd-amd64
            build/olcrtc-openbsd-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
